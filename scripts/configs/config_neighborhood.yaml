defaults:
  - model: neuralode
  - data: lorenz63_dyslim
  - training: vanilla
  - override hydra/launcher: submitit_slurm
  - _self_

neighborhood:
  order: 2
  use_taylor_mode: false
  r_min_multiplier: 3 
  r_max_init: 1.5
  r_max_num_sweep: 15
  target_neighborhood_rel_size: 0.05
  num_neighbors: 32
  num_neighbor_threshold: 32
  rollout: 4
  weight: 1.0
  chunk_size: null
  neighbor_position_loss: true
  

hydra:
  launcher: 
    timeout_min: 900
    tasks_per_node: 1
    gpus_per_node: 1

enable_x64: true

gpu_id: "auto" # or integer